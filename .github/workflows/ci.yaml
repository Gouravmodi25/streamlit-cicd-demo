name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile streamlit_app.py

      - name: Smoke test the app
        run: |
          python -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('streamlit_app.py').run(); assert not at.exception, at.exception; print('App ran OK')"
